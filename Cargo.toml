[workspace]
members = ["style", "omnia"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
authors = ["Augentic"]
repository = "https://github.com/augentic/lints"

[workspace.dependencies]
# The clippy_utils rev and the rust-toolchain.toml nightly move together;
# both come from the dylint release we track (see README § Toolchain).
clippy_utils = { git = "https://github.com/rust-lang/rust-clippy"}
dylint_linting = "6.0"
dylint_testing = "6.0"
serde = { version = "1", features = ["derive"] }
