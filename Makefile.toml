# Install: `cargo install cargo-make`
# Help: https://sagiegurari.github.io/cargo-make/

[env]
CARGO_MAKE_EXTEND_WORKSPACE_MAKEFILE = true

[config]
default_to_workspace = false
skip_core_tasks = true
skip_crate_env_info = true
skip_git_env_info = true
skip_rust_env_info = true

[tasks.check]
dependencies = ["fmt", "lint", "test"]

[tasks.ci]
dependencies = ["fmt-check", "lint", "test", "deny"]

# The pinned nightly (rust-toolchain.toml) carries rustfmt.
[tasks.fmt]
command = "cargo"
args = ["fmt", "--all"]

[tasks.fmt-check]
command = "cargo"
args = ["fmt", "--all", "--check"]

[tasks.lint]
command = "cargo"
args = ["clippy", "--workspace", "--all-targets", "--", "-D", "warnings"]

# UI tests build the cdylibs through dylint-link; install it first
# (`cargo install dylint-link`).
[tasks.test]
command = "cargo"
args = ["test", "--workspace"]

[tasks.deny]
command = "cargo"
args = ["deny", "--workspace", "check"]
install_crate = "cargo-deny"
